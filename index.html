<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Brick Breaker</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
  html,body{height:100%;margin:0;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;font-family:system-ui,Segoe UI,Roboto,Arial}
  canvas{background:linear-gradient(#012,#001);border:4px solid #034;box-shadow:0 8px 40px rgba(0,0,0,.6)}
  .ui{position:fixed;top:12px;left:12px;font-size:14px}
  button{padding:6px 10px;border-radius:6px;border:0;background:#045;color:#cff;cursor:pointer}
</style>
</head>
<body>
<div class="ui">
  <div>Score: <span id="score">0</span> &nbsp; Lives: <span id="lives">3</span></div>
  <div style="margin-top:6px"><button id="start">Start</button></div>
</div>
<canvas id="c" width="480" height="640"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const startBtn = document.getElementById('start');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');

  let paddle = {w:100, h:12, x: W/2 - 50, y: H - 40, speed: 600};
  let ball = {x: W/2, y: H - 60, r:8, vx: 220, vy: -220, stuck: true};
  let bricks = [];
  let rows = 6, cols = 9;
  let padding = 8, offsetTop = 60, offsetLeft = 28;
  let score = 0, lives = 3;
  let running = false, lastTime = 0;
  let keys = {};

  function resetBricks(){
    bricks = [];
    const brickW = (W - offsetLeft*2 - padding*(cols-1)) / cols;
    for (let r=0;r<rows;r++){
      for (let c=0;c<cols;c++){
        const x = offsetLeft + c * (brickW + padding);
        const y = offsetTop + r * (20 + padding);
        bricks.push({x,y,w:brickW,h:20,alive:true,color: `hsl(${r/rows*60+20}deg 70% 60%)`});
      }
    }
  }

  resetBricks();
  scoreEl.textContent = score;
  livesEl.textContent = lives;

  window.addEventListener('keydown', e => { keys[e.key]=true; if (!running && e.key===' ') start(); });
  window.addEventListener('keyup', e => { keys[e.key]=false; });
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    paddle.x = Math.min(Math.max(mx - paddle.w/2, 0), W - paddle.w);
    if (ball.stuck) ball.x = paddle.x + paddle.w/2;
  });
  canvas.addEventListener('click', () => { if (!running) start(); else if (ball.stuck) ball.stuck=false; });
  startBtn.addEventListener('click', start);

  function start(){
    running = true;
    ball.stuck = true;
    ball.x = paddle.x + paddle.w/2;
    ball.y = paddle.y - ball.r - 2;
    ball.vx = 220 * (Math.random()>0.5?1:-1);
    ball.vy = -220;
    score = 0; lives = 3;
    resetBricks();
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  function update(dt){
    // paddle via keys
    if (keys['ArrowLeft']||keys['a']) paddle.x -= paddle.speed * dt;
    if (keys['ArrowRight']||keys['d']) paddle.x += paddle.speed * dt;
    paddle.x = Math.min(Math.max(paddle.x, 0), W - paddle.w);
    if (ball.stuck) { ball.x = paddle.x + paddle.w/2; ball.y = paddle.y - ball.r - 2; }
    else {
      ball.x += ball.vx * dt;
      ball.y += ball.vy * dt;
      // wall collisions
      if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
      if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx *= -1; }
      if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }
      // paddle collision
      if (ball.y + ball.r > paddle.y && ball.y + ball.r < paddle.y + paddle.h && ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
        // reflect with angle based on hit position
        const rel = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
        const speed = Math.hypot(ball.vx, ball.vy) * 1.02; // slight speedup
        const angle = rel * Math.PI/3; // -60deg..60deg
        ball.vx = Math.sin(angle) * speed;
        ball.vy = -Math.cos(angle) * speed;
        ball.y = paddle.y - ball.r - 1;
      }
      // bottom (lose life)
      if (ball.y - ball.r > H) {
        lives--;
        livesEl.textContent = lives;
        ball.stuck = true;
        ball.x = paddle.x + paddle.w/2;
        ball.y = paddle.y - ball.r - 2;
        if (lives <= 0) { running = false; showGameOver(); }
      }
      // brick collisions
      for (const b of bricks) {
        if (!b.alive) continue;
        if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
          b.alive = false;
          score += 10;
          scoreEl.textContent = score;
          // simple collision response: invert Y unless hitting side
          const prevX = ball.x - ball.vx * dt;
          if (prevX + ball.r <= b.x || prevX - ball.r >= b.x + b.w) ball.vx *= -1;
          else ball.vy *= -1;
          // tiny speed increase
          ball.vx *= 1.01; ball.vy *= 1.01;
          break;
        }
      }
      // win condition
      if (bricks.every(b=>!b.alive)) {
        running = false;
        showWin();
      }
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    // background grid
    ctx.fillStyle = '#001018';
    ctx.fillRect(0,0,W,H);
    // bricks
    for (const b of bricks) {
      if (!b.alive) continue;
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)';
      ctx.strokeRect(b.x, b.y, b.w, b.h);
    }
    // paddle
    ctx.fillStyle = '#7de';
    roundRect(ctx, paddle.x, paddle.y, paddle.w, paddle.h, 6, true, false);
    // ball
    ctx.fillStyle = '#ffd';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
    ctx.fill();
    // HUD text when paused
    if (!running) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, H/2 - 60, W, 120);
      ctx.fillStyle = '#7de';
      ctx.font = '20px system-ui,Segoe UI,Roboto';
      ctx.textAlign = 'center';
      ctx.fillText('Brick Breaker', W/2, H/2 - 10);
      ctx.fillStyle = '#cde';
      ctx.font = '14px system-ui,Segoe UI,Roboto';
      ctx.fillText('Click or press Start to play. Click during play to release the ball.', W/2, H/2 + 18);
    }
  }

  function loop(ts){
    if (!running) return;
    const dt = Math.min(0.04, (ts - lastTime)/1000);
    lastTime = ts;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function showGameOver(){
    draw();
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#f66';
    ctx.font = '28px system-ui,Segoe UI,Roboto';
    ctx.textAlign = 'center';
    ctx.fillText('Game Over', W/2, H/2 - 6);
    ctx.fillStyle = '#cde';
    ctx.font = '14px system-ui,Segoe UI,Roboto';
    ctx.fillText('Press Start to try again', W/2, H/2 + 20);
  }

  function showWin(){
    draw();
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#6f6';
    ctx.font = '26px system-ui,Segoe UI,Roboto';
    ctx.textAlign = 'center';
    ctx.fillText('You Win!', W/2, H/2 - 6);
    ctx.fillStyle = '#cde';
    ctx.font = '14px system-ui,Segoe UI,Roboto';
    ctx.fillText('Press Start to play again', W/2, H/2 + 22);
  }

  function roundRect(ctx,x,y,w,h,r,fill,stroke){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    if(fill) ctx.fill();
    if(stroke) ctx.stroke();
  }

  // initial idle draw
  (function idle(){
    draw();
    requestAnimationFrame(idle);
  })();
})();
</script>
</body>
</html>
