<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>2D Craft — Demo</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="ui">
  <div id="topbar">
    <div id="controls">Arrows / A-D: move • Space: jump • Left-click: break • Right-click: place • 1-4: select</div>
    <div id="score">Blocks: <span id="blocksCount">0</span></div>
    <button id="save">Save</button>
    <button id="load">Load</button>
    <button id="reset">Reset</button>
  </div>
  <canvas id="game" width="1024" height="512"></canvas>
  <div id="hotbar"></div>
</div>
<script src="game.js"></script>
</body>
</html>
