<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Maze Runner</title>
<style>
  :root{--bg:#0b1220;--tile:#111827;--path:#e6edf3;--player:#60a5fa;--goal:#34d399}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial}
  body{background:linear-gradient(180deg,#071022 0%,#081427 100%);display:flex;align-items:center;justify-content:center;color:var(--path)}
  #game{width:640px;height:640px;border-radius:12px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);box-shadow:0 10px 30px rgba(2,6,23,.6);position:relative}
  canvas{display:block;width:100%;height:100%}
  .ui{position:absolute;left:12px;top:12px;font-weight:700}
  .btn{background:rgba(255,255,255,0.04);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .hidden{display:none}
  .center{text-align:center}
</style>
</head>
<body>
  <div id="game" role="application" aria-label="Maze Runner">
    <canvas id="c" width="640" height="640"></canvas>
    <div class="ui">
      <div id="moves">Moves: 0</div>
      <div style="height:6px"></div>
      <div id="best">Best: -</div>
    </div>

    <div id="start" class="overlay">
      <div class="center">
        <h2 style="margin:0 0 10px">Maze Runner</h2>
        <div class="btn" id="startBtn">New Maze</div>
        <div style="height:8px"></div>
        <div style="font-size:13px;opacity:.9">Use arrow keys or swipe to move. Reach the green goal.</div>
      </div>
    </div>

    <div id="win" class="overlay hidden">
      <div class="center">
        <h2 id="winMsg" style="margin:0 0 10px">You Escaped!</h2>
        <div class="btn" id="againBtn">Play Again</div>
        <div style="height:6px"></div>
        <div id="winInfo" style="font-size:13px;opacity:.95"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const size = 21; // odd for maze algorithm
  const cell = Math.floor(canvas.width / size);
  const movesEl = document.getElementById('moves');
  const bestEl = document.getElementById('best');
  const startOverlay = document.getElementById('start');
  const winOverlay = document.getElementById('win');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const winInfo = document.getElementById('winInfo');

  let grid, player, goal, moves, best = localStorage.getItem('mazeRunnerBest') || null;
  if (best) bestEl.textContent = 'Best: ' + best;

  function initGrid(){
    // Start with wall-filled grid; carve using recursive backtracker on odd cells
    grid = Array(size).fill().map(()=>Array(size).fill(1));
    const stack = [];
    const sx = 1, sy = 1;
    grid[sy][sx]=0;
    stack.push([sx,sy]);
    while(stack.length){
      const [x,y] = stack[stack.length-1];
      const dirs = shuffle([[2,0],[-2,0],[0,2],[0,-2]]);
      let carved=false;
      for (const [dx,dy] of dirs){
        const nx = x+dx, ny = y+dy;
        if (nx>0 && nx<size-1 && ny>0 && ny<size-1 && grid[ny][nx]===1){
          grid[ny][nx]=0;
          grid[y+dy/2][x+dx/2]=0;
          stack.push([nx,ny]);
          carved=true;
          break;
        }
      }
      if (!carved) stack.pop();
    }
    // place player and goal
    player = { x:1, y:1 };
    goal = { x:size-2, y:size-2 };
    moves = 0;
    updateUI();
    draw();
  }

  function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]] } return a }

  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    // background
    ctx.fillStyle = '#071022';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    // draw cells
    for(let y=0;y<size;y++){
      for(let x=0;x<size;x++){
        const px = x*cell, py = y*cell;
        if (grid[y][x]===1){
          ctx.fillStyle = '#0f1724';
          ctx.fillRect(px,py,cell,cell);
        } else {
          ctx.fillStyle = '#0b1220';
          ctx.fillRect(px,py,cell,cell);
        }
      }
    }
    // draw goal
    ctx.fillStyle = '#34d399';
    ctx.fillRect(goal.x*cell+cell*0.15, goal.y*cell+cell*0.15, cell*0.7, cell*0.7);
    // draw player
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath();
    ctx.arc(player.x*cell + cell/2, player.y*cell + cell/2, cell*0.35, 0, Math.PI*2);
    ctx.fill();
    // grid accent
    ctx.strokeStyle = 'rgba(255,255,255,0.02)';
    ctx.strokeRect(0,0,canvas.width,canvas.height);
  }

  function updateUI(){ movesEl.textContent = 'Moves: ' + moves; if (best) bestEl.textContent = 'Best: ' + best; }

  function tryMove(dx,dy){
    const nx = player.x + dx, ny = player.y + dy;
    if (nx<0||ny<0||nx>=size||ny>=size) return;
    if (grid[ny][nx]===0){
      player.x = nx; player.y = ny; moves++;
      updateUI(); draw();
      checkWin();
    }
  }

  function checkWin(){
    if (player.x === goal.x && player.y === goal.y){
      winOverlay.classList.remove('hidden');
      winInfo.textContent = 'Moves: ' + moves;
      if (!best || moves < best){
        best = moves; localStorage.setItem('mazeRunnerBest', best); bestEl.textContent = 'Best: ' + best;
        winInfo.textContent += ' — New Best!';
      }
    }
  }

  // Keyboard
  window.addEventListener('keydown', e=>{
    if (startOverlay.classList.contains('hidden') && winOverlay.classList.contains('hidden')){
      if (e.key === 'ArrowUp') tryMove(0,-1);
      if (e.key === 'ArrowDown') tryMove(0,1);
      if (e.key === 'ArrowLeft') tryMove(-1,0);
      if (e.key === 'ArrowRight') tryMove(1,0);
    }
    if (!startOverlay.classList.contains('hidden') && (e.key==='Enter' || e.key===' ')) startGame();
  });

  // touch swipe
  let sx, sy;
  canvas.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; });
  canvas.addEventListener('touchend', e=>{
    if (!sx) return;
    const t = e.changedTouches[0]; const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)){
      if (dx > 30) tryMove(1,0);
      if (dx < -30) tryMove(-1,0);
    } else {
      if (dy > 30) tryMove(0,1);
      if (dy < -30) tryMove(0,-1);
    }
    sx = sy = null;
  });

  function startGame(){ startOverlay.classList.add('hidden'); winOverlay.classList.add('hidden'); initGrid(); }

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', ()=>{ winOverlay.classList.add('hidden'); initGrid(); });

  // initial draw
  (function intro(){
    ctx.fillStyle = '#e6edf3';
    ctx.font = '20px system-ui,Segoe UI,Roboto,Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Maze Runner', canvas.width/2, canvas.height/2 - 20);
    ctx.font = '13px system-ui,Segoe UI,Roboto,Arial';
    ctx.fillText('New random maze — reach the green goal', canvas.width/2, canvas.height/2 + 6);
  })();

})();
</script>
</body>
</html>
