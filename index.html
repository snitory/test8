<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Donut SMP 2D Prototype</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="800" height="400"></canvas>
    <div id="hud">
      <div id="status">Layer: front | Sprint: off | FP: off</div>
      <div id="inv">Inventory: <span id="inv-items">empty</span> | Offhand: <span id="offhand">none</span></div>
    </div>
    <div id="chat-wrap">
      <div id="chat-log"></div>
      <div id="autocomplete" class="hidden"></div>
      <input id="chat-input" placeholder="Press / for commands" />
    </div>
  </div>

  <div id="esc-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Server Settings</h3>
      <label>Server IP: <input id="server-ip" /></label>
      <label>Marketplace IP: <input id="market-ip" /></label>
      <button id="save-ip">Save</button>
      <button id="close-esc">Close</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
