<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Space Defender</title>
<style>
  :root{--bg:#04060a;--ship:#60a5fa;--enemy:#fb7185;--bullet:#fff}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:radial-gradient(ellipse at top,#071428 0%,var(--bg) 60%);display:flex;align-items:center;justify-content:center;color:#e6edf3}
  #game{width:480px;height:720px;background:linear-gradient(180deg,rgba(255,255,255,0.02),transparent);border-radius:12px;box-shadow:0 12px 40px rgba(2,6,23,.6);position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:100%}
  .ui{position:absolute;left:12px;top:12px;font-weight:700}
  .ui .score{font-size:18px}
  .btn{background:rgba(255,255,255,0.04);padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.04);cursor:pointer}
  .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .hidden{display:none}
  .center{text-align:center}
</style>
</head>
<body>
  <div id="game" role="application" aria-label="Space Defender">
    <canvas id="c" width="480" height="720"></canvas>
    <div class="ui">
      <div class="score" id="score">Score: 0</div>
      <div style="height:6px"></div>
      <div id="lives">Lives: 3</div>
    </div>

    <div id="start" class="overlay">
      <div class="center">
        <h2 style="margin:0 0 10px">Space Defender</h2>
        <div class="btn" id="startBtn">Start</div>
        <div style="height:8px"></div>
        <div style="font-size:13px;opacity:.9">Move with mouse/touch or ← → keys. Shoot with space or tap.</div>
      </div>
    </div>

    <div id="gameOver" class="overlay hidden">
      <div class="center">
        <h2 id="finalMsg" style="margin:0 0 10px">Game Over</h2>
        <div class="btn" id="retryBtn">Play Again</div>
        <div style="height:8px"></div>
        <div id="finalScore" style="font-size:13px;opacity:.95"></div>
      </div>
    </div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // state
  let running=false, last=0, spawnTimer=0, spawnInterval=1400, score=0, lives=3;
  const ship = { x: W/2, y: H - 70, w:36, h:22, vx:0, speed:480 };
  let bullets = [], enemies = [], explosions = [];

  // DOM
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const startOverlay = document.getElementById('start');
  const startBtn = document.getElementById('startBtn');
  const gameOverOverlay = document.getElementById('gameOver');
  const retryBtn = document.getElementById('retryBtn');
  const finalScore = document.getElementById('finalScore');

  // input
  let pointerX = ship.x;
  window.addEventListener('mousemove', e=>{
    const r = canvas.getBoundingClientRect();
    pointerX = (e.clientX - r.left) * (canvas.width / r.width);
  });
  window.addEventListener('touchmove', e=>{
    const t = e.touches[0];
    const r = canvas.getBoundingClientRect();
    pointerX = (t.clientX - r.left) * (canvas.width / r.width);
  }, {passive:false});

  window.addEventListener('keydown', e=>{
    if (!running && (e.key==='Enter' || e.key===' ')) startGame();
    if (e.key==='ArrowLeft') ship.vx = -1;
    if (e.key==='ArrowRight') ship.vx = 1;
    if (e.key === ' ') fire();
  });
  window.addEventListener('keyup', e=>{
    if (e.key==='ArrowLeft' || e.key==='ArrowRight') ship.vx = 0;
  });
  canvas.addEventListener('click', fire);
  canvas.addEventListener('touchstart', e=>{ fire(); e.preventDefault(); }, {passive:false});

  function updateUI(){ scoreEl.textContent = 'Score: ' + score; livesEl.textContent = 'Lives: ' + lives; }

  function startGame(){
    score = 0; lives = 3; bullets = []; enemies = []; explosions = []; spawnInterval = 1400;
    running = true; last = performance.now(); spawnTimer = 0;
    startOverlay.classList.add('hidden'); gameOverOverlay.classList.add('hidden');
    updateUI(); requestAnimationFrame(loop);
  }

  function endGame(){
    running = false;
    finalScore.textContent = 'Score: ' + score;
    gameOverOverlay.classList.remove('hidden');
  }

  // spawn enemies
  function spawnEnemy(){
    const w = randInt(28,48), h = randInt(18,28);
    const x = rand(w/2, W - w/2);
    const type = Math.random() < 0.12 ? 'fast' : Math.random() < 0.12 ? 'big' : 'small';
    const speed = type === 'fast' ? rand(220,320) : type === 'big' ? rand(70,130) : rand(110,180);
    enemies.push({ x, y:-h, w, h, speed, hp: type==='big'?3:1, type, angle:0, wobble: Math.random()*2 });
  }

  function fire(){
    if (!running) return;
    bullets.push({ x: ship.x, y: ship.y - ship.h/2 - 6, r:3, speed: 540 });
  }

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function randInt(a,b){ return Math.floor(rand(a,b+1)); }

  function loop(t){
    const dt = Math.min(40, t - last);
    last = t;
    if (!running) return;

    // spawn
    spawnTimer += dt;
    if (spawnTimer > spawnInterval){
      spawnTimer = 0;
      spawnEnemy();
      spawnInterval = Math.max(550, spawnInterval - 12);
    }

    // ship movement: follow pointer smoothly + keyboard
    const targetX = pointerX || ship.x;
    ship.x += (targetX - ship.x) * Math.min(1, dt/100) + ship.vx * ship.speed * (dt/1000);
    ship.x = Math.max(ship.w/2, Math.min(W - ship.w/2, ship.x));

    // bullets
    for (let i = bullets.length-1; i>=0; i--){
      const b = bullets[i];
      b.y -= b.speed * (dt/1000);
      if (b.y < -10) bullets.splice(i,1);
    }

    // enemies
    for (let i = enemies.length-1; i>=0; i--){
      const e = enemies[i];
      e.y += e.speed * (dt/1000);
      e.angle += 0.05 * e.wobble;
      // collide with bullets
      for (let j = bullets.length-1; j>=0; j--){
        const b = bullets[j];
        if (pointInRect(b.x, b.y, e.x - e.w/2, e.y - e.h/2, e.w, e.h)){
          bullets.splice(j,1);
          e.hp -= 1;
          explosions.push({ x: b.x, y: b.y, life: 260 });
          if (e.hp <= 0){
            // destroyed
            score += e.type === 'big' ? 50 : e.type === 'fast' ? 20 : 10;
            explosions.push({ x: e.x, y: e.y, big:true, life: 560 });
            enemies.splice(i,1);
            updateUI();
            break;
          } else {
            score += 6;
            updateUI();
          }
        }
      }
      // collide with ship
      if (rectsIntersect({x:ship.x, y:ship.y, w:ship.w, h:ship.h}, {x:e.x, y:e.y, w:e.w, h:e.h})){
        enemies.splice(i,1);
        explosions.push({ x: ship.x, y: ship.y, big:true, life: 560 });
        lives -= 1;
        updateUI();
        if (lives <= 0){ endGame(); return; }
      }
      // remove if offscreen
      if (e.y - e.h/2 > H + 40) enemies.splice(i,1);
    }

    // explosions life
    for (let i = explosions.length-1; i>=0; i--){
      const ex = explosions[i];
      ex.life -= dt;
      if (ex.life <= 0) explosions.splice(i,1);
    }

    // draw
    ctx.clearRect(0,0,W,H);
    // starfield
    drawStars(t);

    // draw ship
    drawShip(ship.x, ship.y);

    // draw bullets
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bullet') || '#fff';
    for (const b of bullets){
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI*2);
      ctx.fill();
    }

    // draw enemies
    for (const e of enemies){
      ctx.save();
      ctx.translate(e.x, e.y);
      ctx.rotate(Math.sin(e.angle)*0.15);
      // body
      ctx.fillStyle = e.type === 'big' ? '#fb923c' : e.type === 'fast' ? '#f43f5e' : '#fb7185';
      roundRect(ctx, -e.w/2, -e.h/2, e.w, e.h, 6, true);
      // eye
      ctx.fillStyle = '#fff';
      ctx.fillRect(-6, -e.h/6, 12, 6);
      ctx.restore();
    }

    // explosions
    for (const ex of explosions){
      const p = Math.max(0, ex.life / 560);
      ctx.beginPath();
      const rad = (ex.big ? 30 : 12) * (1 - p) + 2;
      ctx.fillStyle = 'rgba(255,200,80,' + (0.9*p) + ')';
      ctx.arc(ex.x, ex.y, rad, 0, Math.PI*2);
      ctx.fill();
    }

    requestAnimationFrame(loop);
  }

  function drawStars(t){
    // moving layered stars
    const s1 = 0.02 * t;
    ctx.fillStyle = '#071429';
    ctx.fillRect(0,0,W,H);
    for (let i=0;i<60;i++){
      const x = (i * 79 + Math.floor(s1* (i%7+1))) % W;
      const y = (i * 47 + Math.floor(s1* (i%5+1))) % H;
      ctx.fillStyle = i%7===0 ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.12)';
      ctx.fillRect(x, y, i%7===0 ? 2 : 1, i%7===0 ? 2 : 1);
    }
  }

  function drawShip(x,y){
    ctx.save();
    ctx.translate(x,y);
    // glow
    ctx.fillStyle = 'rgba(96,165,250,0.08)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 36, 10, 0, 0, Math.PI*2);
    ctx.fill();
    // body
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath();
    ctx.moveTo(0,-18);
    ctx.lineTo(18,10);
    ctx.lineTo(0,6);
    ctx.lineTo(-18,10);
    ctx.closePath();
    ctx.fill();
    // cockpit
    ctx.fillStyle = '#0b1220';
    ctx.beginPath();
    ctx.ellipse(0, -6, 6, 4, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function roundRect(ctx,x,y,w,h,r,fill){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.arcTo(x+w,y,x+w,y+h,r);
    ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r);
    ctx.arcTo(x,y,x+w,y,r);
    ctx.closePath();
    if (fill) ctx.fill(); else ctx.stroke();
  }

  function pointInRect(px,py,rx,ry,rw,rh){
    return px >= rx && px <= rx+rw && py >= ry && py <= ry+rh;
  }

  function rectsIntersect(a,b){
    return !(a.x + a.w/2 < b.x - b.w/2 || a.x - a.w/2 > b.x + b.w/2 || a.y - a.h/2 > b.y + b.h/2 || a.y + a.h/2 < b.y - b.h/2);
  }

  // buttons
  startBtn.addEventListener('click', startGame);
  retryBtn.addEventListener('click', startGame);

  // initial screen
  (function intro(){
    ctx.fillStyle = '#e6edf3';
    ctx.font = '20px system-ui,Segoe UI,Roboto,Arial';
    ctx.textAlign = 'center';
    ctx.fillText('Space Defender', W/2, H/2 - 20);
    ctx.font = '13px system-ui,Segoe UI,Roboto,Arial';
    ctx.fillText('Shoot enemies. Move with mouse/touch or arrow keys.', W/2, H/2 + 6);
  })();

})();
</script>
</body>
</html>
